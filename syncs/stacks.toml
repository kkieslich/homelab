# Komodo Stack resources — one per compose stack, Git-mode (Komodo/Periphery
# clones this repo onto the target host and runs `docker compose` from
# `run_directory`). Applied via a Komodo Resource Sync (GitOps).
#
# All data bind mounts inside these compose files are ABSOLUTE (/persist/...),
# so they resolve to the host path regardless of Komodo's clone directory.
# Workload secrets are committed only as SOPS ciphertext beside each stack and
# decrypted by pre_deploy. Plaintext never enters Git or Komodo variables.
#
# Deploy order mirrors the old homeserver-compose ordering; proxy first
# (creates nothing but is the ingress), actual last.

[[stack]]
name = "proxy"
deploy = true
tags = ["prod", "um870"]
[stack.config]
server = "um870"
git_provider = "github.com"
repo = "kkieslich/homelab"
branch = "main"
run_directory = "stacks/proxy"
file_paths = ["docker-compose.yml"]
# The separate five-minute Proxy refresh must not hit Docker Hub every cycle,
# hence no auto pull. KNOWN CONSEQUENCE: Caddy image digest changes do NOT roll
# out here either — `auto_pull` gates the only `compose pull` in the deploy path
# (see the long note on the beerbot stack), so Global Auto Update will detect a
# new caddy digest, redeploy without fetching it, and then detect it again every
# 15 minutes forever. Unlike beerbot this cannot be fixed by flipping the flag:
# the 5-minute refresh procedure is a full DeployStack, so auto_pull = true would
# mean ~288 Docker Hub pulls a day from the lab's shared anonymous IP, which is
# the rate limit that already broke a beerbot rollout on 2026-08-06. The real fix
# is a registry mirror or a Docker Hub login on the daemon (home-infrastructure),
# or decoupling the Caddyfile refresh from a full stack deploy.
auto_pull = false
poll_for_updates = true
auto_update = true
[stack.config.pre_deploy]
path = ""
shell_mode = true
command = 'K=/var/lib/komodo-periphery/age-key.txt; SOPS_AGE_KEY_FILE=$K sops -d --input-type dotenv --output-type dotenv enc.env > .env && chmod 600 .env'

# wg-easy — WireGuard VPN + web UI for remote LAN access (SSH to um870, the
# router UI, printers: everything not published through Caddy). The public
# *.home.kki.berlin routes are unaffected; this only adds a private path.
#
# Deployed right after proxy because Caddy publishes its UI at
# vpn.home.kki.berlin over proxy_net. First boot is unattended (INIT_* env in the
# compose file + sops enc.env), so no browser wizard is needed and the VPN comes
# up purely from Git.
#
# OPERATOR GATE: clients cannot handshake until UDP 51820 is forwarded from the
# router to um870's LAN IP. Nothing in this repo can create that forward.
[[stack]]
name = "wg-easy"
# TEMP-DISABLED 2026-10-28: box is at a temporary home, only beerbot (+proxy) runs.
# To restore: set deploy/poll_for_updates/auto_update back to true and redeploy.
deploy = false
tags = ["prod", "um870"]
[stack.config]
server = "um870"
git_provider = "github.com"
repo = "kkieslich/homelab"
branch = "main"
run_directory = "stacks/wg-easy"
file_paths = ["docker-compose.yml"]
# GHCR image, so unlike the caddy/beerbot Docker Hub images there is no shared
# anonymous rate limit to protect — auto_pull can stay at Komodo's default true,
# which is what actually makes a new digest roll out (see the beerbot note).
auto_pull = true
poll_for_updates = false
auto_update = false
[stack.config.pre_deploy]
path = ""
shell_mode = true
command = 'K=/var/lib/komodo-periphery/age-key.txt; SOPS_AGE_KEY_FILE=$K sops -d --input-type dotenv --output-type dotenv enc.env > .env && chmod 600 .env'

