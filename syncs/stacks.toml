# Sendspin player — the official OHF Python player (sendspin-cli), built locally
# from stacks/sendspin/Dockerfile. Connects to the Music Assistant Sendspin
# server (host network, :8927) and plays to the couch PipeWire HDMI sink → Denon.
# Replaces the NixOS sendspin-go service, whose Go client deadlocked during
# playback (blocking channel sends in its websocket read-loop). No image poll
# (local build); no secrets. run_build rebuilds the local image on deploy
# (layer-cache no-op unless the Dockerfile/source changed).
[[stack]]
name = "sendspin"
# TEMP-DISABLED 2026-10-28: box is at a temporary home, only beerbot (+proxy) runs.
# To restore: set deploy/poll_for_updates/auto_update back to true and redeploy.
deploy = false
tags = ["prod", "um870"]
[stack.config]
server = "um870"
git_provider = "github.com"
repo = "kkieslich/homelab"
branch = "main"
run_directory = "stacks/sendspin"
file_paths = ["docker-compose.yml"]
run_build = true

# Doctolib watcher — polls a booking page every 2 minutes and pushes a free
# slot to the phone via ntfy. Moved off the Mac, where launchd only ran while
# the lid was open (~6% coverage). Locally built from stacks/doctolib-watch
# (no registry image, so no digest polling); run_build rebuilds on a push that
# changes watch.py. What is watched is personal and this repo is public, so the
# config and the ntfy topic are both SOPS ciphertext, decrypted here.
