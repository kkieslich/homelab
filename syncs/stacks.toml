[[stack]]
name = "actual"
deploy = true
tags = ["prod", "um870"]
[stack.config]
server = "um870"
git_provider = "github.com"
repo = "kkieslich/homelab"
branch = "main"
run_directory = "stacks/actual"
file_paths = ["docker-compose.yml"]
poll_for_updates = true
auto_update = true
# The fints images and actual_db_sync are built from this repository and have
# no remote registry digest. run_build makes every deploy run `docker compose
# build` first (a layer-cache no-op when sources are unchanged), so a git push
# that changes importer/db-sync source rebuilds and rolls out without the
# manual SSH rebuild step.
run_build = true
auto_update_skip_services = ["actual_db_sync"]
# Decrypt the env secret (enc.env -> .env) and the fints banks config
# (banks.toml.enc -> banks.toml) with the host age key just before compose runs.
[stack.config.pre_deploy]
path = ""
shell_mode = true
command = 'K=/var/lib/komodo-periphery/age-key.txt; SOPS_AGE_KEY_FILE=$K sops -d --input-type dotenv --output-type dotenv enc.env > .env && chmod 600 .env && SOPS_AGE_KEY_FILE=$K sops -d --input-type binary --output-type binary banks.toml.enc > banks.toml && chmod 644 banks.toml'

# BeerBot — runs the GHCR images built by github.com/BeerbotApp/BeerBot. Live prod
# data is forward-synced by the in-stack migrator (parallel run). The images are
# private; Periphery authenticates to GHCR via the `docker login` in pre_deploy
# below (no Komodo registry account is involved).
[[stack]]
name = "beerbot"
deploy = true
tags = ["prod", "um870"]
[stack.config]
server = "um870"
git_provider = "github.com"
repo = "kkieslich/homelab"
branch = "main"
run_directory = "stacks/beerbot"
file_paths = ["docker-compose.yml"]
# MUST stay true (the Komodo default). `auto_pull` gates the ONLY `docker compose
# pull` in Komodo's deploy path — with it false, a deploy runs `compose up -d`
# against whatever `:latest` the host already holds, and Compose's default `up`
# pull policy is `missing`, so a new image is never fetched. Since
# `destroy_before_deploy` is false, Compose then sees an identical image+config
# and does not even recreate the container: the deploy is a silent no-op.
#
# That is not hypothetical. This was `false` until 2026-08-09, and the effect was
# that the running digest never changed, so the poller reported "update available"
# forever: Komodo fired an Auto Redeploy every 15 minutes round the clock (141 in
# 72h) and every one of them did nothing. New CI images only ever reached prod
# when someone clicked Pull + Deploy by hand.
#
# It was set false to keep Docker Hub off the critical path, because one 429
# aborts the whole `compose pull`. That concern is real but is already handled
# properly one layer down: the four Docker Hub images in this stack carry
# `pull_policy: missing` (see the compose file), so the pull skips them without a
# registry request. The flag was a redundant second mitigation that broke rollout.
auto_pull = true
# Private GHCR images — pre_deploy decrypts the repo-owned registry credential
# and logs the Periphery Docker client in before Compose pulls images.
# Auto-deploy on new images: the Global Auto Update procedure HEAD-checks GHCR
# every 15 minutes for a new digest on the :latest app images and redeploys when
# one appears — so a CI push of a new image rolls out on its own, no webhook/CI
# hook needed. Note that check only compares digests; the actual fetch is the
# `compose pull` gated by auto_pull above, which is why that must stay true.
# Only the services whose image changed are updated (pinned postgres/keycloak/minio
# are untouched). Poll cadence = Core's default KOMODO_POLL_RATE.
poll_for_updates = true
auto_update = true
# Keep stateful data services and their matching init jobs out of unattended
# digest rollouts. Application and identity images still update automatically.
# beerbot-keycloak-config is here for a different reason: its image is version-
# pinned, so it can never have an update, but the poller still HEAD-requested it
# on Docker Hub every 15 minutes and logged a 429 (144 failures in 72h) while
# burning the lab's shared anonymous rate limit. Skipping it removes pure noise.
auto_update_skip_services = ["beerbot-db", "beerbot-db-init", "beerbot-keycloak-config", "beerbot-minio", "beerbot-minio-init"]
# Successful init/provision jobs are expected to exit and must not make the
# steady-state stack appear unhealthy.
ignore_services = ["beerbot-db-init", "beerbot-keycloak-config", "beerbot-minio-init", "beerbot-provision"]
# Deploy-time secret decryption: decrypt the sops-encrypted enc.env in this repo
# to a gitignored ./.env (which every service reads via env_file) using the host
# age key, just before compose runs. Also decrypt fcm-api.json.enc → ./fcm-api.json
# (the v4 FCM service-account key mounted into beerbot-api for push sends), same as
# the actual stack decrypts banks.toml.enc. sops is on Periphery's PATH and reads its
# private age-key copy (both provisioned by the NixOS komodo module). Komodo runs
# pre_deploy with cwd = run_directory, so enc.env/.env are plain relative paths.
#
# The last step extracts beerbot-realm.json out of the Keycloak image instead of
# reading a copy committed here. The BeerBot repo owns that file; this repo used
# to carry a hand-synced duplicate, which is a silent-drift trap — edit one, forget
# the other, and the realm deploys stale with no error anywhere. CI rebuilds the
# Keycloak image on scripts/keycloak/**, so the image always carries the current
# realm. The explicit pull is still required even though auto_pull is true:
# pre_deploy runs BEFORE Compose's pull step, so without it we would extract the
# realm from whatever stale image the host happens to hold at that moment.
[stack.config.pre_deploy]
path = ""
shell_mode = true
command = '''set -eu; K=/var/lib/komodo-periphery/age-key.txt; R=.registry.env; trap 'rm -f "$R"; [ -n "${CID:-}" ] && docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT; SOPS_AGE_KEY_FILE=$K sops -d --input-type dotenv --output-type dotenv enc.env > .env && chmod 600 .env; SOPS_AGE_KEY_FILE=$K sops -d --input-type binary --output-type binary fcm-api.json.enc > fcm-api.json && chmod 600 fcm-api.json; SOPS_AGE_KEY_FILE=$K sops -d --input-type binary --output-type binary old-vps.key.enc > old-vps.key && chmod 600 old-vps.key; SOPS_AGE_KEY_FILE=$K sops -d --input-type binary --output-type binary registry.env.enc > "$R" && chmod 600 "$R"; set -a; . ./"$R"; set +a; printf %s "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin >/dev/null; KC_IMG=ghcr.io/beerbotapp/beerbot/keycloak:latest; docker pull -q "$KC_IMG" >/dev/null; mkdir -p scripts/keycloak; CID=$(docker create "$KC_IMG"); docker cp "$CID":/opt/keycloak/realm/beerbot-realm.json scripts/keycloak/beerbot-realm.json'''

# Sendspin player — the official OHF Python player (sendspin-cli), built locally
# from stacks/sendspin/Dockerfile. Connects to the Music Assistant Sendspin
# server (host network, :8927) and plays to the couch PipeWire HDMI sink → Denon.
# Replaces the NixOS sendspin-go service, whose Go client deadlocked during
# playback (blocking channel sends in its websocket read-loop). No image poll
# (local build); no secrets. run_build rebuilds the local image on deploy
# (layer-cache no-op unless the Dockerfile/source changed).
[[stack]]
name = "sendspin"
deploy = true
tags = ["prod", "um870"]
[stack.config]
server = "um870"
git_provider = "github.com"
repo = "kkieslich/homelab"
branch = "main"
run_directory = "stacks/sendspin"
file_paths = ["docker-compose.yml"]
run_build = true
